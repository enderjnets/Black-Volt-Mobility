<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Black Volt</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0A0A0F; color: #E9EEF3;
        font-family: -apple-system, system-ui, Roboto, sans-serif;
      }
      .wrap { height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
      .dot { width: 48px; height: 48px; border-radius: 50%;
        background: #00E5FF; box-shadow: 0 0 32px rgba(0,229,255,.6); }
      h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
      p { color: #8A94A6; font-size: 14px; margin: 0; max-width: 260px; }
    </style>
  </head>
  <body>
    <!-- Fallback shown only if the live site can't be reached; the app normally
         loads server.url immediately. -->
    <div class="wrap">
      <div class="dot"></div>
      <h1>Black Volt</h1>
      <p>Connecting… check your internet connection.</p>
    </div>
  </body>
</html>

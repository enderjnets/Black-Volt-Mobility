services:
  db:
    image: postgres:16-alpine
    container_name: blackvolt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackvolt_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-blackvolt}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackvolt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # 5435 — coexist with the four Eko stacks (5432/5433/5434) on the ROG.
      - "127.0.0.1:5435:5432"

  redis:
    image: redis:7-alpine
    container_name: blackvolt-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      # 6382 — coexist with Eko stacks (6379/6380/6381).
      - "127.0.0.1:6382:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackvolt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackvolt:blackvolt_local_pass@db:5432/blackvolt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      # LLM
      LLM_PRIMARY: ${LLM_PRIMARY:-kimi}
      LLM_FALLBACK: ${LLM_FALLBACK:-minimax}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-for-coding}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/anthropic}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
      # Auth
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Extra accepted Google Sign-In audiences (comma-separated), e.g. the
      # native Android/iOS OAuth clients. Merged with GOOGLE_CLIENT_ID.
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS:-}
      # Maps (Phase 2)
      MAPS_SIMULATED: ${MAPS_SIMULATED:-true}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Square payments (Phase 3)
      PAYMENTS_SIMULATED: ${PAYMENTS_SIMULATED:-true}
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_PLAN_OPERATOR_MONTHLY: ${SQUARE_PLAN_OPERATOR_MONTHLY:-}
      SQUARE_PLAN_OPERATOR_ANNUAL: ${SQUARE_PLAN_OPERATOR_ANNUAL:-}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_URL: ${SQUARE_WEBHOOK_URL:-}
      ENTITLEMENTS_ENFORCED: ${ENTITLEMENTS_ENFORCED:-false}
      SUBSCRIBE_RATE_PER_EMAIL_HOURLY: ${SUBSCRIBE_RATE_PER_EMAIL_HOURLY:-5}
      SUBSCRIBE_RATE_PER_IP_HOURLY: ${SUBSCRIBE_RATE_PER_IP_HOURLY:-30}
      # Defaults already include driver.blackvoltmobility.com (see config.py);
      # override to restrict or add origins per environment.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3005,https://driver.blackvoltmobility.com}
      # Google Calendar (scheduled rides)
      CALENDAR_SIMULATED: ${CALENDAR_SIMULATED:-true}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_OAUTH_TOKEN_FILE: ${GOOGLE_OAUTH_TOKEN_FILE:-}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/Denver}
      DISPATCH_ADDRESS: ${DISPATCH_ADDRESS:-}
      CALENDAR_INVITEES: ${CALENDAR_INVITEES:-}
      CALENDAR_BLOCK_BUFFER_MIN: ${CALENDAR_BLOCK_BUFFER_MIN:-20}
      # Per-user calendar OAuth (team members connect their own Google Calendar)
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      CALENDAR_TOKEN_ENC_KEY: ${CALENDAR_TOKEN_ENC_KEY:-}
      # Smart reservation (screenshot → fields, MiniMax vision)
      SMART_SIMULATED: ${SMART_SIMULATED:-true}
      SMART_VISION_PROVIDER: ${SMART_VISION_PROVIDER:-minimax_coding_vlm}
      SMART_VISION_API_KEY: ${SMART_VISION_API_KEY:-}
      SMART_MAX_IMAGES: ${SMART_MAX_IMAGES:-6}
      SMART_VISION_TIMEOUT: ${SMART_VISION_TIMEOUT:-90}
      SMART_VISION_HOST: ${SMART_VISION_HOST:-https://api.minimax.io}
      SMART_VISION_BASE_URL: ${SMART_VISION_BASE_URL:-https://api.minimax.io/anthropic}
      SMART_VISION_MODEL: ${SMART_VISION_MODEL:-MiniMax-M3}
      # Email (team welcome emails via Resend)
      EMAIL_SIMULATED: ${EMAIL_SIMULATED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Black Volt Mobility <noreply@blackvoltmobility.com>}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-https://app.blackvoltmobility.com/dashboard}
      # Web Push (PWA notifications). Generate once with backend/scripts/gen_vapid.py
      # and set the keys in .env (never commit them). Empty → push is a silent no-op.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@blackvoltmobility.com}
      # Native push (Android/iOS) via Firebase Cloud Messaging HTTP v1. Set both
      # in .env (service account creds base64 + project id, never commit them).
      # Empty → FCM sends are a silent no-op.
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CREDENTIALS_JSON_B64: ${FCM_CREDENTIALS_JSON_B64:-}
      # Social media module (Phase "Social") — simulated by default; live needs
      # platform OAuth + a BitTrader render worker (see docs/setup-social-media.md).
      SOCIAL_SIMULATED: ${SOCIAL_SIMULATED:-true}
      SOCIAL_RENDER_URL: ${SOCIAL_RENDER_URL:-}
      SOCIAL_RENDER_SIGNING_KEY: ${SOCIAL_RENDER_SIGNING_KEY:-}
      SOCIAL_RENDER_CALLBACK_URL: ${SOCIAL_RENDER_CALLBACK_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_ENABLED: ${META_CAPI_ENABLED:-false}
      META_CAPI_SIMULATED: ${META_CAPI_SIMULATED:-true}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_DIRECT_PUBLISH: ${TIKTOK_DIRECT_PUBLISH:-false}
      # Buffer publishing — approved posts go out via the owner's Buffer account.
      BUFFER_API_KEY: ${BUFFER_API_KEY:-}
      BUFFER_ORG_ID: ${BUFFER_ORG_ID:-}
      SOCIAL_PUBLISH_VIA_BUFFER: ${SOCIAL_PUBLISH_VIA_BUFFER:-false}
      OWNER_TENANT_ID: ${OWNER_TENANT_ID:-}
      # Featured events scanner (free dev keys; empty = that source is skipped).
      SEATGEEK_CLIENT_ID: ${SEATGEEK_CLIENT_ID:-}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      EVENTS_MIN_SCORE: ${EVENTS_MIN_SCORE:-0.6}
      EVENTS_SCAN_ENABLED: ${EVENTS_SCAN_ENABLED:-true}
      BLOG_AUTOPILOT_ENABLED: ${BLOG_AUTOPILOT_ENABLED:-true}
      GOOGLE_PSI_API_KEY: ${GOOGLE_PSI_API_KEY:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://blackvoltmobility.com}
      EVENTS_BASE_LAT: ${EVENTS_BASE_LAT:-39.6005}
      EVENTS_BASE_LNG: ${EVENTS_BASE_LNG:--104.7926}
      # Uber Black formula fallback (published Denver rates; tune without a deploy).
      UBER_BLACK_BASE: ${UBER_BLACK_BASE:-15}
      UBER_BLACK_PER_MILE: ${UBER_BLACK_PER_MILE:-5}
      UBER_BLACK_PER_MINUTE: ${UBER_BLACK_PER_MINUTE:-0.55}
      UBER_BLACK_BOOKING_FEE: ${UBER_BLACK_BOOKING_FEE:-3}
      UBER_BLACK_MINIMUM: ${UBER_BLACK_MINIMUM:-35}
      UBER_SUV_MULTIPLIER: ${UBER_SUV_MULTIPLIER:-1.25}
      # Live price scout (optional; empty → formula-only). Internal URL when enabled.
      PRICING_SCOUT_URL: ${PRICING_SCOUT_URL:-}
      PRICING_SCOUT_SECRET: ${PRICING_SCOUT_SECRET:-}
    volumes:
      # Service-account JSON for Google Calendar (gitignored; absent in dev).
      - ./secrets:/secrets:ro
      # Owner-uploaded brand assets (logo/photo) — persist across rebuilds.
      - blackvolt-media:/app/media
    ports:
      # 8012 — coexist with Eko backends (8000/8002/8010/8011).
      - "8012:8000"

  # Stage 2 render bridge. Renders an mp4 from a signed job and posts it back to
  # the backend's HMAC-verified callback. This image has no BitTrader pipeline, so
  # it emits a branded ffmpeg sample clip (BV_RENDER_SAMPLE=1); for real AI video
  # point SOCIAL_RENDER_URL at a BitTrader-equipped worker instead. No published
  # ports — only reachable inside the compose network (backend → render-worker).
  render-worker:
    build:
      context: ./render-worker
      dockerfile: Dockerfile
    container_name: blackvolt-render-worker
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BV_RENDER_SIGNING_KEY: ${SOCIAL_RENDER_SIGNING_KEY:-}
      BV_RENDER_PORT: "8090"
      BV_RENDER_SAMPLE: ${BV_RENDER_SAMPLE:-1}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Baked into the Next rewrite at build time (routes-manifest).
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        # Driver landing (driver.blackvoltmobility.com) — inlined/baked at build.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.blackvoltmobility.com/dashboard}
        NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL:-hola@blackvoltmobility.com}
        DRIVER_HOSTS: ${DRIVER_HOSTS:-driver.blackvoltmobility.com}
        # Meta Pixel id (public). Empty → no pixel ships. Set in the VPS .env.
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    container_name: blackvolt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    ports:
      # 3005 — coexist with Eko frontends (3001/3002/3003/3004).
      - "3005:3000"

  # Optional live Uber-price scraper. Off by default (heavy Playwright image); enable with
  # `docker compose --profile scout up -d pricing-scout`. Internal network only.
  pricing-scout:
    build:
      context: ./pricing-scout
      dockerfile: Dockerfile
    container_name: blackvolt-pricing-scout
    restart: unless-stopped
    profiles: ["scout"]
    environment:
      PRICING_SCOUT_SECRET: ${PRICING_SCOUT_SECRET:-}
    mem_limit: 1g
    expose:
      - "8100"

volumes:
  postgres-data:
  blackvolt-media:

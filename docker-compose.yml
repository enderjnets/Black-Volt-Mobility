services:
  db:
    image: postgres:16-alpine
    container_name: blackvolt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackvolt_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-blackvolt}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackvolt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # 5435 — coexist with the four Eko stacks (5432/5433/5434) on the ROG.
      - "127.0.0.1:5435:5432"

  redis:
    image: redis:7-alpine
    container_name: blackvolt-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      # 6382 — coexist with Eko stacks (6379/6380/6381).
      - "127.0.0.1:6382:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackvolt-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://blackvolt:blackvolt_local_pass@db:5432/blackvolt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      # LLM
      LLM_PRIMARY: ${LLM_PRIMARY:-kimi}
      LLM_FALLBACK: ${LLM_FALLBACK:-minimax}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-for-coding}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/anthropic}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
      # Auth
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS:-}
      # Maps (Phase 2)
      MAPS_SIMULATED: ${MAPS_SIMULATED:-true}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Square payments (Phase 3)
      PAYMENTS_SIMULATED: ${PAYMENTS_SIMULATED:-true}
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_PLAN_OPERATOR_MONTHLY: ${SQUARE_PLAN_OPERATOR_MONTHLY:-}
      SQUARE_PLAN_OPERATOR_ANNUAL: ${SQUARE_PLAN_OPERATOR_ANNUAL:-}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_URL: ${SQUARE_WEBHOOK_URL:-}
      ENTITLEMENTS_ENFORCED: ${ENTITLEMENTS_ENFORCED:-false}
      SUBSCRIBE_RATE_PER_EMAIL_HOURLY: ${SUBSCRIBE_RATE_PER_EMAIL_HOURLY:-5}
      SUBSCRIBE_RATE_PER_IP_HOURLY: ${SUBSCRIBE_RATE_PER_IP_HOURLY:-30}
      # Defaults already include driver.blackvoltmobility.com (see config.py);
      # override to restrict or add origins per environment.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3005,https://driver.blackvoltmobility.com}
      # Google Calendar (scheduled rides)
      CALENDAR_SIMULATED: ${CALENDAR_SIMULATED:-true}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_OAUTH_TOKEN_FILE: ${GOOGLE_OAUTH_TOKEN_FILE:-}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/Denver}
      DISPATCH_ADDRESS: ${DISPATCH_ADDRESS:-}
      CALENDAR_INVITEES: ${CALENDAR_INVITEES:-}
      CALENDAR_BLOCK_BUFFER_MIN: ${CALENDAR_BLOCK_BUFFER_MIN:-20}
      # Smart reservation (screenshot → fields, MiniMax vision)
      SMART_SIMULATED: ${SMART_SIMULATED:-true}
      SMART_VISION_PROVIDER: ${SMART_VISION_PROVIDER:-minimax_coding_vlm}
      SMART_VISION_API_KEY: ${SMART_VISION_API_KEY:-}
      SMART_MAX_IMAGES: ${SMART_MAX_IMAGES:-5}
      SMART_VISION_TIMEOUT: ${SMART_VISION_TIMEOUT:-90}
      SMART_VISION_HOST: ${SMART_VISION_HOST:-https://api.minimax.io}
      SMART_VISION_BASE_URL: ${SMART_VISION_BASE_URL:-https://api.minimax.io/anthropic}
      SMART_VISION_MODEL: ${SMART_VISION_MODEL:-MiniMax-M3}
      # Email (team welcome emails via Resend)
      EMAIL_SIMULATED: ${EMAIL_SIMULATED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Black Volt Mobility <noreply@blackvoltmobility.com>}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-https://app.blackvoltmobility.com/dashboard}
      # Social media module (Phase "Social") — simulated by default; live needs
      # platform OAuth + a BitTrader render worker (see docs/setup-social-media.md).
      SOCIAL_SIMULATED: ${SOCIAL_SIMULATED:-true}
      SOCIAL_RENDER_URL: ${SOCIAL_RENDER_URL:-}
      SOCIAL_RENDER_SIGNING_KEY: ${SOCIAL_RENDER_SIGNING_KEY:-}
      SOCIAL_RENDER_CALLBACK_URL: ${SOCIAL_RENDER_CALLBACK_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_DIRECT_PUBLISH: ${TIKTOK_DIRECT_PUBLISH:-false}
    volumes:
      # Service-account JSON for Google Calendar (gitignored; absent in dev).
      - ./secrets:/secrets:ro
      # Owner-uploaded brand assets (logo/photo) — persist across rebuilds.
      - blackvolt-media:/app/media
    ports:
      # 8012 — coexist with Eko backends (8000/8002/8010/8011).
      - "8012:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # Baked into the Next rewrite at build time (routes-manifest).
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
        # Driver landing (driver.blackvoltmobility.com) — inlined/baked at build.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.blackvoltmobility.com/dashboard}
        NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL:-hola@blackvoltmobility.com}
        DRIVER_HOSTS: ${DRIVER_HOSTS:-driver.blackvoltmobility.com}
    container_name: blackvolt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    ports:
      # 3005 — coexist with Eko frontends (3001/3002/3003/3004).
      - "3005:3000"

volumes:
  postgres-data:
  blackvolt-media:
